<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    /* st194 murni diisi warna toska tua tanpa stroke/outline putih */
    .st194{fill:#00796B;}

    .z-breathe {
      animation: breathe 2.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
  </style>
</defs>

<g>
  <!-- Latar Belakang Hijau Toska Tua Murni Tanpa Outline Putih -->
  <path class="st194" d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03
    C28.51,26.72,26.72,28.51,24.51,28.51z"/>
  
  <!-- Elemen Berwarna Solid di Atasnya dengan Efek Animasi Bernapas -->
  <g class="z-breathe">
    <!-- Kotak Toska Muda (Kanan Atas) -->
    <rect x="16.0" y="2.9" width="11.1" height="11.1" rx="1.6" fill="#4DB6AC" />
    
    <!-- Kotak Kuning (Kiri Bawah) -->
    <rect x="2.9" y="15.1" width="11.2" height="11.2" rx="1.6" fill="#FFC107" />
    
    <!-- Bentuk Tangga Utama Segitiga Merah Muda / Coral -->
    <path d="M 4.4,26.3 
             L 27.1,4.4 
             A 0.2 0.2 0 0 1 27.2,4.6
             L 27.2,26.3 
             Z" 
          fill="#FF7A85" 
          opacity="0.85" />
  </g>
</g>
</svg>
